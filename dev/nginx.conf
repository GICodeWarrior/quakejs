server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ioquake3.js is very large and highly compressible; this is the main reason
    # to use a real web server here.
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        application/javascript text/javascript application/json
                      text/css text/plain image/svg+xml application/manifest+json;

    # The client is fetched once per session and changes on every build, so let
    # it revalidate rather than pinning a stale engine in browser caches.
    location = /ioquake3.js {
        add_header Cache-Control "no-cache";
    }

    location /hf/shenanigans/ {
        add_header Cache-Control "no-cache";
    }

    location /favicon/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
