---
# Builds and publishes the two runtime images, and extracts the pk3 artifacts.
#
# Deliberately one sequential job rather than a matrix: every target shares the
# toolchain and quake-build stages, so building them in a single BuildKit session
# compiles those once and reuses them from the local cache. Parallel jobs would
# each have to re-import the (very large) toolchain layers from the remote cache,
# or recompile LLVM outright -- which is why the pak artifacts are built here
# rather than in a workflow of their own.
name: Container Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  registry: ghcr.io
  cache_scope: quakejs

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4.2.2
        with:
          # ioq3 is a submodule and is the build's primary input.
          submodules: true

      - name: Setup docker build
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The toolchain is built from the `toolchain` stage in Containerfile and
      # cached, so the three image builds below reuse it rather than recompiling
      # LLVM. Pushing it is optional -- it is published here so that developers
      # can set TOOLCHAIN_IMAGE and skip the local toolchain build entirely.
      - name: Compute toolchain image name
        id: toolchain
        run: |
          echo "image=${{ env.registry }}/${{ github.repository }}/toolchain:main" \
            | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"

      - name: ${{ format('Build{0}toolchain', (github.event_name == 'push' && '+Push ' || ' ')) }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: toolchain
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.toolchain.outputs.image }}
          platforms: "linux/amd64"
          cache-from: type=gha,scope=${{ env.cache_scope }}
          cache-to: type=gha,scope=${{ env.cache_scope }},mode=max

      - name: Metadata for server
        id: meta_server
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.registry }}/${{ github.repository }}/server

      - name: ${{ format('Build{0}server', (github.event_name == 'push' && '+Push ' || ' ')) }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: server
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta_server.outputs.tags }}
          labels: ${{ steps.meta_server.outputs.labels }}
          platforms: "linux/amd64"
          build-args: |
            MAKE_JOBS=4
          cache-from: type=gha,scope=${{ env.cache_scope }}
          cache-to: type=gha,scope=${{ env.cache_scope }},mode=max

      - name: Metadata for web
        id: meta_web
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.registry }}/${{ github.repository }}/web

      - name: ${{ format('Build{0}web', (github.event_name == 'push' && '+Push ' || ' ')) }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: web
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
          platforms: "linux/amd64"
          # Must match the other targets: MAKE_JOBS is interpolated into the
          # quake-build RUN, so a different value is a cache miss and recompiles
          # the whole engine.
          build-args: |
            MAKE_JOBS=4
          cache-from: type=gha,scope=${{ env.cache_scope }}
          cache-to: type=gha,scope=${{ env.cache_scope }},mode=max

      # The `paks` target is a scratch image holding just the two pk3 files, so
      # --output extracts them directly with no container to run or copy from.
      # Everything it needs is already in the local cache by this point.
      - name: Build paks
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: paks
          platforms: "linux/amd64"
          outputs: type=local,dest=artifacts
          build-args: |
            MAKE_JOBS=4
          cache-from: type=gha,scope=${{ env.cache_scope }}
          cache-to: type=gha,scope=${{ env.cache_scope }},mode=max

      - name: Upload pak100.pk3
        uses: actions/upload-artifact@v4
        with:
          name: pak100.pk3
          path: artifacts/pak100.pk3

      - name: Upload pak101.pk3
        uses: actions/upload-artifact@v4
        with:
          name: pak101.pk3
          path: artifacts/pak101.pk3
